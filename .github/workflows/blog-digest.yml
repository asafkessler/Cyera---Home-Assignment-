# NHI Blog Digest (bonus): fetch the latest post from oasis.security/blog,
# summarize it with Claude, and open a Jira ticket through IdentityHub's API.
#
# The job is self-contained: it starts the backend from this repository,
# creates a throwaway account connected to the Jira workspace given in
# secrets, and runs the digest against it. Nothing is deployed anywhere.
#
# Required repository secrets:
#   ANTHROPIC_API_KEY, JIRA_SITE_URL, JIRA_EMAIL, JIRA_API_TOKEN
# Optional: JIRA_PROJECT_KEY (default SCRUM)

name: NHI Blog Digest

on:
  schedule:
    - cron: "17 6 * * *"      # daily at 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Create a ticket even if the latest post was already reported"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            automations/blog-digest/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r automations/blog-digest/requirements.txt

      - name: Start IdentityHub backend
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/ci.db
        run: |
          python -m app.keys > ../.env
          nohup uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break || sleep 1
          done
          curl -sf http://localhost:8000/api/health

      - name: Register account, connect Jira, create API key
        env:
          JIRA_SITE_URL: ${{ secrets.JIRA_SITE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python automations/blog-digest/bootstrap_ci.py

      # Remember the last reported post across runs so the same post is not
      # ticketed twice. Cache entries are immutable, so each run saves a new
      # one and the next run restores the most recent by prefix.
      - name: Restore digest state
        uses: actions/cache/restore@v4
        with:
          path: automations/blog-digest/state.json
          key: blog-digest-state-${{ github.run_id }}
          restore-keys: blog-digest-state-

      - name: Run the digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY || 'SCRUM' }}
          IDENTITYHUB_API_URL: http://localhost:8000
        run: |
          python automations/blog-digest/digest.py ${{ inputs.force && '--force' || '' }}

      - name: Save digest state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: automations/blog-digest/state.json
          key: blog-digest-state-${{ github.run_id }}

      - name: Backend log (on failure)
        if: failure()
        run: tail -n 100 backend.log || true
